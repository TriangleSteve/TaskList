<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Personal task tracker">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="src/styles.css">
  <title>Task Tracker</title>
</head>
<body>
  <header class="app-header">
    <div>
      <h1>Tasks</h1>
      <div id="sync-status" class="sync-status">Local only</div>
    </div>
    <button id="new-task-btn" class="primary">+ New Task</button>
  </header>

  <nav class="tabs" aria-label="Views">
    <button class="tab active" data-view="current">Current</button>
    <button class="tab" data-view="recent">Recent</button>
    <button class="tab" data-view="history">History</button>
    <button class="tab" data-view="settings">Settings</button>
  </nav>

  <main id="app"></main>

  <dialog id="task-dialog">
    <form id="task-form" method="dialog">
      <div class="dialog-header">
        <h2 id="dialog-title">New Task</h2>
        <button type="button" id="close-dialog" class="icon-btn" aria-label="Close">×</button>
      </div>
      <input type="hidden" id="task-id">
      <label>Description
        <input id="description" required maxlength="200" autocomplete="off">
      </label>
      <div class="form-grid">
        <label>Status
          <select id="status">
            <option>Priority</option>
            <option>Next Up</option>
            <option>Waiting On</option>
            <option>Recurring</option>
            <option>Completed</option>
            <option>Scrapped</option>
          </select>
        </label>
        <label>Category
          <input id="category" maxlength="60" placeholder="Work">
        </label>
        <label>Subcategory
          <input id="subcategory" maxlength="60" placeholder="Fabric">
        </label>
        <label>Due date
          <input id="due-date" type="date">
        </label>
        <label>Waiting on
          <input id="waiting-on" maxlength="100">
        </label>
        <label>Parent task
          <input id="parent-task" inputmode="numeric" placeholder="Optional ID">
        </label>
      </div>
      <label>Notes
        <textarea id="notes" rows="5" placeholder="Context, outcome, links, etc."></textarea>
      </label>
      <div class="form-actions">
        <button type="button" id="delete-task-btn" class="danger hidden">Delete</button>
        <span></span>
        <button type="button" id="cancel-btn" class="secondary">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="src/app.js"></script>
</body>
</html>
