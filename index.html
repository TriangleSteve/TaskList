<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Local-first personal planner for tasks and events" />
  <title>Planner</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
  <link rel="stylesheet" href="styles.css?v=2.2.0" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <button id="menuBtn" class="icon-button menu-button" aria-label="Open navigation" aria-expanded="false" aria-controls="appNav">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
      </button>
      <h1>Planner</h1>
      <div class="profile-control">
        <button id="profileButton" class="profile-button" type="button" aria-label="Change profile" aria-haspopup="true" aria-expanded="false"></button>
        <div id="profileMenu" class="profile-menu hidden" role="menu"></div>
      </div>
      <button id="newTaskBtn" class="contrast new-task-button" aria-label="New task" title="New task">+</button>
    </div>
  </header>

  <div id="navBackdrop" class="nav-backdrop hidden" aria-hidden="true"></div>
  <aside id="appNav" class="app-nav" aria-label="Primary navigation">
    <div class="nav-mobile-header"><button id="closeNavBtn" class="icon-button close-nav" aria-label="Close navigation">×</button></div>
    <nav class="nav-links">
      <button class="tab-button active" data-view="active"><span>Planner</span></button>
      <button class="tab-button" data-view="summary"><span>Summary</span></button>
      <button class="tab-button" data-view="settings"><span>Data & Profiles</span></button>
    </nav>
    <div id="sidebarBackup" class="sidebar-backup"></div>
  </aside>

  <main class="app-main">
    <section id="activeView" class="view-panel"></section>
    <section id="summaryView" class="view-panel hidden"></section>
    <section id="settingsView" class="view-panel hidden"></section>
  </main>

  <dialog id="taskDialog">
    <article>
      <header class="dialog-header"><h2 id="taskDialogTitle" tabindex="-1">Details</h2></header>
      <form id="taskForm" autocomplete="off">
        <input id="taskId" type="hidden" />
        <label>Description<input id="description" type="text" autocomplete="off" maxlength="120" required placeholder="What needs to be done?" /></label>
        <label>Notes<textarea id="notes" rows="8" autocomplete="off" placeholder="Progress, decisions, links, completion notes..."></textarea></label>
        <details class="advanced-fields">
          <summary>Advanced</summary>
          <div class="advanced-grid">
            <label>Status<select id="status" required></select></label>
            <label class="focus-toggle"><input id="focusToday" type="checkbox" role="switch" /> Focus</label>
            <label>Tags <span class="muted small">(comma separated)</span><input id="tags" type="text" autocomplete="off" placeholder="follow-up, admin" /></label>
            <div id="recurrenceFields" class="recurrence-fields hidden">
              <label>Repeat<select id="recurrence"><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select></label>
              <label>Next occurrence<input id="nextOccurrence" type="date" /></label>
            </div>
            <div class="form-grid two">
              <label>Date added<input id="dateAdded" type="date" /></label>
              <label>Date completed<input id="dateCompleted" type="date" /></label>
            </div>
          </div>
        </details>
        <div class="dialog-bottom-actions" aria-label="Task actions">
          <button type="button" id="duplicateTaskBtn" class="task-action secondary outline" aria-label="Duplicate task" title="Duplicate"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="10" height="10" rx="2"/><rect x="5" y="5" width="10" height="10" rx="2"/></svg></button>
          <button type="button" id="completeTaskBtn" class="task-action secondary outline" aria-label="Mark task complete" title="Complete"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l4 4L19 6"/></svg></button>
          <button type="button" id="closeTaskDialog" class="task-action secondary outline" aria-label="Discard changes" title="Discard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          <button type="submit" class="task-action" aria-label="Save task" title="Save"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h12l2 2v14H5z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></svg></button>
        </div>
      </form>
    </article>
  </dialog>

  <dialog id="eventDialog">
    <article>
      <header class="dialog-header"><h2 id="eventDialogTitle" tabindex="-1">Event</h2></header>
      <form id="eventForm" autocomplete="off">
        <input id="eventId" type="hidden" />
        <label>Title<input id="eventTitle" type="text" autocomplete="off" maxlength="120" required placeholder="What is happening?" /></label>
        <div class="form-grid two">
          <label>Date<input id="eventDate" type="date" required /></label>
          <label>Time<input id="eventTime" type="time" /></label>
        </div>
        <details class="event-advanced-fields">
          <summary>Advanced</summary>
          <div class="advanced-grid">
            <label>Notes<textarea id="eventNotes" rows="6" autocomplete="off" placeholder="Location, preparation, links, outcome..."></textarea></label>
            <label>Status<select id="eventStatus"><option>Scheduled</option><option>Completed</option><option>Cancelled</option></select></label>
            <label>Tags <span class="muted small">(comma separated)</span><input id="eventTags" type="text" autocomplete="off" placeholder="appointment, family" /></label>
          </div>
        </details>
        <div class="dialog-bottom-actions" aria-label="Event actions">
          <button type="button" id="completeEventBtn" class="task-action secondary outline" aria-label="Mark event complete" title="Complete"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l4 4L19 6"/></svg></button>
          <button type="button" id="closeEventDialog" class="task-action secondary outline" aria-label="Discard changes" title="Discard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          <button type="submit" class="task-action" aria-label="Save event" title="Save"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h12l2 2v14H5z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></svg></button>
        </div>
      </form>
    </article>
  </dialog>

  <dialog id="profileDialog">
    <article>
      <header class="dialog-header"><h2>Profiles</h2><button aria-label="Close" rel="prev" id="closeProfileDialog"></button></header>
      <div id="profileList"></div>
      <form id="addProfileForm" class="profile-add-form" autocomplete="off">
        <div id="newProfileIcons" class="profile-icon-picker" aria-label="Profile icon"></div>
        <input id="newProfileName" type="text" autocomplete="off" placeholder="New profile name" required />
        <button type="submit">Add</button>
      </form>
    </article>
  </dialog>

  <input id="importFile" type="file" accept="application/json,.json" hidden />
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <script src="app.js?v=2.2.0"></script>
</body>
</html>
