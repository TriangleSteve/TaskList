<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Local-first personal task tracker" />
  <title>Tasks</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
  <link rel="stylesheet" href="styles.css?v=1.2.0" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <button id="menuBtn" class="icon-button menu-button" aria-label="Open navigation" aria-expanded="false" aria-controls="appNav">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
      </button>

      <h1>Tasks</h1>

      <label class="profile-picker">
        <span class="sr-only">Profile</span>
        <select id="profileSelect" aria-label="Current profile"></select>
      </label>

      <button id="newTaskBtn" class="contrast new-task-button" aria-label="New task" title="New task">+</button>
    </div>
  </header>

  <div id="navBackdrop" class="nav-backdrop hidden" aria-hidden="true"></div>
  <aside id="appNav" class="app-nav" aria-label="Primary navigation">
    <div class="nav-header">
      <strong>Navigation</strong>
      <button id="closeNavBtn" class="icon-button close-nav" aria-label="Close navigation">×</button>
    </div>
    <nav class="nav-links">
      <button class="tab-button active" data-view="active"><span>Active</span></button>
      <button class="tab-button" data-view="summary"><span>Summary</span></button>
      <button class="tab-button" data-view="all"><span>All Tasks</span></button>
      <button class="tab-button" data-view="settings"><span>Data & Profiles</span></button>
    </nav>
  </aside>

  <main class="app-main">
    <section id="activeView" class="view-panel"></section>
    <section id="summaryView" class="view-panel hidden"></section>
    <section id="allView" class="view-panel hidden"></section>
    <section id="settingsView" class="view-panel hidden"></section>
  </main>

  <dialog id="taskDialog">
    <article>
      <header class="dialog-header task-dialog-header">
        <h2 id="taskDialogTitle">Task</h2>
        <div class="dialog-top-actions">
          <button type="button" id="closeTaskDialog" class="secondary outline">Discard</button>
          <button type="submit" form="taskForm" id="topSaveTaskBtn">Save</button>
        </div>
      </header>

      <form id="taskForm">
        <input id="taskId" type="hidden" />

        <label>
          Description
          <textarea id="description" rows="3" required placeholder="What needs to be done?"></textarea>
        </label>

        <label>
          Notes
          <textarea id="notes" rows="7" placeholder="Progress, decisions, links, completion notes..."></textarea>
        </label>

        <details class="advanced-fields">
          <summary>Advanced fields</summary>
          <div class="advanced-grid">
            <label>
              Status
              <select id="status" required></select>
            </label>
            <label>
              Tags <span class="muted small">(comma separated)</span>
              <input id="tags" type="text" placeholder="dashboard, follow-up, admin" />
            </label>
            <div class="form-grid two">
              <label>
                Date added
                <input id="dateAdded" type="datetime-local" />
              </label>
              <label>
                Date completed
                <input id="dateCompleted" type="datetime-local" />
              </label>
            </div>
          </div>
        </details>

        <div class="dialog-actions">
          <button type="button" id="duplicateTaskBtn" class="secondary">Duplicate</button>
          <span class="spacer"></span>
          <button type="button" id="deleteTaskBtn" class="outline secondary">Delete</button>
        </div>
      </form>
    </article>
  </dialog>

  <dialog id="profileDialog">
    <article>
      <header class="dialog-header">
        <h2>Profiles</h2>
        <button aria-label="Close" rel="prev" id="closeProfileDialog"></button>
      </header>
      <div id="profileList"></div>
      <form id="addProfileForm" class="inline-form">
        <input id="newProfileName" type="text" placeholder="New profile name" required />
        <button type="submit">Add</button>
      </form>
    </article>
  </dialog>

  <input id="importFile" type="file" accept="application/json,.json" hidden />

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <script src="app.js?v=1.2.0"></script>
</body>
</html>
